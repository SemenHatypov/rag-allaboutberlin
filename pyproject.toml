[project]
name = "rag-allaboutberlin"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.33.0",
    "beautifulsoup4==4.12.3",
    "lxml>=6.1.0",
    "minsearch",
    "openai",
    "python-dotenv",
    "sentence-transformers>=5.5.1",
    "streamlit>=1.40.0",
    "torch>=2.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov==6.0.0",
    "responses==0.25.3",
    "jupyter",
    "toyaikit>=0.0.11",
    "tqdm>=4.67.3",
    "pandas>=3.0.3",
]

# CPU-only torch on Linux (Docker/CI): the default PyPI wheels pull in
# multi-GB CUDA libraries that this app never uses.
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--cov=scraper --cov=ingest --cov=rag_helper --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]
