name: Weekly re-scrape

# Keeps the committed corpus fresh. Runs the scraper and rebuilds the embeddings,
# then commits output/json/* back to main if anything changed. The scraper needs
# no secrets (no OPENAI_API_KEY). Enable Actions on the repo to activate this.

on:
  schedule:
    - cron: "0 4 * * 1"  # Mondays 04:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: rescrape
  cancel-in-progress: false

jobs:
  rescrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history — needed to mirror the repo to the HF Space

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Re-scrape guides
        run: uv run python scraper.py

      - name: Rebuild embeddings
        run: uv run python build_embeddings.py

      - name: Commit changes if the corpus moved
        run: |
          if [ -n "$(git status --porcelain output/json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add output/json
            git commit -m "chore: weekly re-scrape of guides"
            git push
          else
            echo "No corpus changes."
          fi

      # Commits made with GITHUB_TOKEN do not trigger other workflows, so the
      # deploy-space.yml push job never fires for the auto-commit above.
      # Mirror to the Hugging Face Space directly instead.
      - name: Deploy to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "HF_TOKEN secret or HF_SPACE variable not set; skipping deploy."
            exit 0
          fi
          git push --force "https://${HF_SPACE%%/*}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" HEAD:main
